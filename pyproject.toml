[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codegen-bench"
version = "0.1.0"
description = "Statistically rigorous benchmark for AI code generation"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Mark Ruvald Pedersen", email = "mark@pedersen.io" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # Core
    "click>=8.1.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
    "rich>=13.7.0",
    "structlog>=24.1.0",

    # AI APIs
    "anthropic>=0.18.0",
    "openai>=1.12.0",

    # Statistical Analysis
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "pandas>=2.1.0",
    "statsmodels>=0.14.0",
    "trueskill>=0.4.5",
    "pingouin>=0.5.4",

    # Multi-Objective Optimization
    "pymoo>=0.6.1",

    # Visualization
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "plotly>=5.18.0",

    # Utilities
    "tqdm>=4.66.0",
    "tenacity>=8.2.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "mypy>=1.8.0",
    "ruff>=0.1.0",
    "ipython>=8.20.0",
]

[project.scripts]
codegen-bench = "codegen_bench.cli.main:cli"

[project.urls]
Homepage = "https://github.com/mpedersen/brownbench"
Repository = "https://github.com/mpedersen/brownbench.git"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=src/codegen_bench",
    "--cov-report=term-missing",
    "--cov-report=html",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
